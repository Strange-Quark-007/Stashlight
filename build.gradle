plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'me.modmuss50.mod-publish-plugin' version "${mod_publish_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven { url 'https://maven.wispforest.io/releases/' }
    maven {
        name = "JitPack"
        url = "https://jitpack.io"
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation "io.wispforest:owo-lib:${project.owo_version}"
    include "io.wispforest:owo-sentinel:${project.owo_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

def targetMcVersions = (findProperty('publish_minecraft_versions') ?: project.minecraft_version)
        .toString().split(',').collect { it.trim() }.findAll { !it.isEmpty() }
def releaseTypeProp = (findProperty('release_type') ?: 'release').toString().toLowerCase()
def releaseNotesFile = file('release-notes.md')

def mrToken = providers.gradleProperty('MODRINTH_TOKEN').orElse(providers.environmentVariable('MODRINTH_TOKEN'))
def cfToken = providers.gradleProperty('CURSEFORGE_TOKEN').orElse(providers.environmentVariable('CURSEFORGE_TOKEN'))
def mrId = findProperty('modrinth_id')?.toString()?.trim()
def cfId = findProperty('curseforge_id')?.toString()?.trim()

def parseDepList = { String key ->
    (findProperty(key) ?: '').toString().split(',').collect { it.trim() }.findAll { !it.isEmpty() }
}
def publishRequires = parseDepList('publish_requires')
def publishOptional = parseDepList('publish_optional')

publishMods {
    file = tasks.named('jar').flatMap { it.archiveFile }
    dryRun = providers.gradleProperty('dryRun').map { it.toBoolean() }.orElse(false)

    changelog = provider {
        if (!releaseNotesFile.exists() || releaseNotesFile.text.trim().isEmpty()) {
            throw new GradleException("Release notes file '${releaseNotesFile.absolutePath}' is missing or empty.")
        }
        return releaseNotesFile.text.trim()
    }

    type = releaseTypeProp == 'alpha' ? ALPHA : (releaseTypeProp == 'beta' ? BETA : STABLE)
    modLoaders.addAll('fabric', 'quilt')
    displayName = "${project.archives_base_name} ${project.mod_version}"
    version = project.mod_version

    if (mrId) {
        modrinth {
            projectId = mrId
            accessToken = mrToken
            environment = 'CLIENT_ONLY'
            targetMcVersions.each { ver -> minecraftVersions.add(ver) }
            requires 'fabric-api'
            publishRequires.each { dep -> if (dep != 'fabric-api') requires dep }
            publishOptional.each { dep -> optional dep }
        }
    }

    if (cfId) {
        curseforge {
            projectId = cfId
            accessToken = cfToken
            client = true
            server = false
            targetMcVersions.each { ver -> minecraftVersions.add(ver) }
            requires 'fabric-api'
            publishRequires.each { dep -> if (dep != 'fabric-api') requires dep }
            publishOptional.each { dep -> optional dep }
        }
    }
}

tasks.named('publishMods').configure {
    doFirst {
        if (!releaseNotesFile.exists() || releaseNotesFile.text.trim().isEmpty()) {
            throw new GradleException("Release notes file is missing or empty: ${releaseNotesFile.absolutePath}")
        }
        if (!mrId && !cfId) {
            throw new GradleException("No platform configured. Set 'modrinth_id' and/or 'curseforge_id' in gradle.properties.")
        }
        if (mrId && !mrToken.isPresent()) {
            throw new GradleException("Cannot publish to Modrinth: 'MODRINTH_TOKEN' is not set.")
        }
        if (cfId && !cfToken.isPresent()) {
            throw new GradleException("Cannot publish to CurseForge: 'CURSEFORGE_TOKEN' is not set.")
        }
    }
}